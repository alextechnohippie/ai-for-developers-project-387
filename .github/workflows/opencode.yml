name: opencode

# Интерактивный агент OpenCode: отвечает на команду /oc или /opencode
# в комментарии к issue/PR и в комментарии к строке diff PR.
# Описание событий, модели и результатов — в README.md (раздел «Агент в GitHub»).
on:
  issue_comment:
    types: [created] # правка комментария не запускает агента повторно
  pull_request_review_comment:
    types: [created]

# Ничего не выдаём по умолчанию; права заданы на уровне задания.
permissions: {}

# Один прогон агента на issue/PR за раз; следующий ждёт в очереди.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  opencode:
    # Модель не вызывается, если:
    #  - автор — бот (агент не отвечает сам себе);
    #  - автор не владелец/участник/коллаборатор репозитория (чужие и fork-контрибьюторы);
    #  - в тексте нет команды из mentions.
    # Дополнительно OpenCode сам проверяет у автора права write/admin.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # чтение репозитория при checkout
      id-token: write # OIDC-токен -> токен GitHub App OpenCode (комментарии, push, PR)
      issues: read # чтение issues через gh CLI из скиллов (docs/agents/issue-tracker.md)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        # Закреплено на коммит релиза v1.19.5 (тег `latest` в репозитории OpenCode устарел).
        uses: anomalyco/opencode/github@810c0eba1a7348036f8bdf61e6632d0c36c6876c # v1.19.5
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Токен только на чтение (contents/issues) для `gh issue view/list` внутри скиллов.
          GH_TOKEN: ${{ github.token }}
        with:
          model: anthropic/claude-sonnet-5-5
          mentions: /opencode,/oc
          # Публикация сессий: не публикуем. В v1.19.5 параметр устарел и игнорируется
          # (шаринг сессий в OpenCode отключён), значение оставлено как явное решение.
          share: false
