name: pr-e2e

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          version: 2026.10.25

      # Тот же кэш, что в ci.yml (общий ключ): без него каждый прогон заново качает
      # зависимости Gradle и упирается в 429 Too Many Requests от Maven Central.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright system dependencies
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run e2e
        id: e2e
        env:
          PW_TRACE: "on"
        run: mise run e2e

      # Playwright очищает test-results/ перед прогоном, поэтому SHA и итог пишем после него.
      - name: Record checked SHA and result
        if: always()
        env:
          RESULT: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p e2e/e2e-meta
          git rev-parse HEAD > e2e/e2e-meta/SHA.txt
          echo "$RESULT" > e2e/e2e-meta/RESULT.txt
          echo "checked: $(cat e2e/e2e-meta/SHA.txt), pr head: $HEAD_SHA, result: $RESULT"

      - name: Upload e2e artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.event.pull_request.head.sha }}
          path: |
            e2e/e2e-meta/
            e2e/test-results/
            e2e/playwright-report/

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.e2e.outcome == 'success' && 'успех' || 'провал' }}
        run: |
          {
            echo "### Браузерная проверка PR"
            echo "- SHA (git rev-parse HEAD): \`$(cat e2e/e2e-meta/SHA.txt)\`"
            echo "- Результат: $RESULT"
            echo "- Артефакт: \`e2e-$HEAD_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
