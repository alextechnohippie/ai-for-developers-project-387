name: claude

# Интерактивный агент Claude Code: отвечает на @claude в комментарии
# к issue/PR и в комментарии к строке diff PR.
# Предел запусков на PR (3 вызова агента) проверяется заданием budget до вызова модели.
# Описание событий, модели, предела и причин остановки — в README.md.
on:
  issue_comment:
    types: [created] # правка комментария не запускает агента повторно
  pull_request_review_comment:
    types: [created]

# Номер issue/PR в имени прогона: по нему задание budget считает запуски одного PR.
run-name: "claude #${{ github.event.issue.number || github.event.pull_request.number }}"

# Ничего не выдаём по умолчанию; права заданы на уровне заданий.
permissions: {}

# Один прогон агента на issue/PR за раз; следующий ждёт в очереди.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Предел запусков: считается до вызова модели, без модели и без секретов.
  # У токена только `actions: read` — счётчик изменить нельзя.
  budget:
    # Тот же фильтр, что и у агента: не бот, доверенный автор, есть @claude.
    if: >-
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      allowed: ${{ steps.count.outputs.allowed }}
      used: ${{ steps.count.outputs.used }}
      limit: ${{ steps.count.outputs.limit }}
    steps:
      - name: Count agent runs for this PR
        id: count
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail
          LIMIT=3

          if [ "$IS_PR" != "true" ]; then
            # Обычный issue: предел не применяется.
            {
              echo "allowed=true"
              echo "used=0"
              echo "limit=$LIMIT"
            } >> "$GITHUB_OUTPUT"
            echo "Комментарий в issue, не в PR: предел запусков не применяется." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TITLE="claude #$NUMBER"
          RUN_IDS=$(gh api --paginate "repos/$REPO/actions/workflows/claude.yml/runs?per_page=100" \
            | jq -r --arg t "$TITLE" '.workflow_runs[] | select(.display_title == $t) | .id')

          USED=0
          for RUN_ID in $RUN_IDS; do
            # filter=all — задания всех попыток (включая Re-run).
            # Считаем задания `claude` с итогом (не skipped, не null),
            # кроме текущей попытки текущего прогона.
            N=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" \
              | jq -r --arg cur_run "$GITHUB_RUN_ID" --arg cur_att "$GITHUB_RUN_ATTEMPT" '
                  .jobs[]
                  | select(.name == "claude")
                  | select(.conclusion != null and .conclusion != "skipped")
                  | select((.run_id | tostring) != $cur_run or (.run_attempt | tostring) != $cur_att)
                  | .id' | wc -l)
            USED=$((USED + N))
          done

          if [ "$USED" -lt "$LIMIT" ]; then ALLOWED=true; else ALLOWED=false; fi
          {
            echo "allowed=$ALLOWED"
            echo "used=$USED"
            echo "limit=$LIMIT"
          } >> "$GITHUB_OUTPUT"
          echo "Предел запусков агента на PR #$NUMBER: использовано $USED/$LIMIT, разрешено: $ALLOWED." >> "$GITHUB_STEP_SUMMARY"

  claude:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # чтение репозитория при checkout
      id-token: write # OIDC-токен -> токен GitHub App Claude (комментарии, issues, push, PR)
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      # Те же инструменты, что локально и в ci.yml: агент может перегенерировать
      # OpenAPI/SDK и запускать `mise run check` перед push.
      - name: Setup mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          version: 2026.10.25

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright system dependencies
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Check token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$CLAUDE_CODE_OAUTH_TOKEN" = "" ]; then
            echo "::error::Секрет CLAUDE_CODE_OAUTH_TOKEN пуст или не задан"
            exit 1
          fi

      - name: Run Claude Code
        # Закреплено на коммит релиза v1.0.278.
        uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1.0.278
        with:
          # Подписка Claude Pro/Max: токен из `claude setup-token`, API-ключ не нужен.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 100
            --allowedTools "Bash(mise run install),Bash(mise run check),Bash(mise run check:fast),Bash(mise run fmt),Bash(mise run contract:build),Bash(mise run sdk:generate)"

  # Отчёт об остановке агента (без модели): исчерпан предел или упал/отменён прогон.
  report:
    needs: [budget, claude]
    if: >-
      always() && needs.budget.result == 'success' &&
      (needs.budget.outputs.allowed == 'false' ||
      needs.claude.result == 'failure' || needs.claude.result == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Report stop reason
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null }}
          ALLOWED: ${{ needs.budget.outputs.allowed }}
          USED: ${{ needs.budget.outputs.used }}
          LIMIT: ${{ needs.budget.outputs.limit }}
          JOB_TIMEOUT_SECONDS: "3600" # timeout-minutes задания claude * 60
        run: |
          set -euo pipefail

          if [ "$ALLOWED" = "false" ]; then
            REASON="limit_exhausted"
          else
            JOB=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
              | jq -c '[.jobs[] | select(.name == "claude")][0]')
            CONCLUSION=$(echo "$JOB" | jq -r '.conclusion')
            FAILED_STEP=$(echo "$JOB" | jq -r '[.steps[] | select(.conclusion == "failure")][0].name // ""')
            DURATION=$(echo "$JOB" | jq -r '((.completed_at | fromdate) - (.started_at | fromdate))')

            if [ "$CONCLUSION" = "failure" ]; then
              case "$FAILED_STEP" in
                "Set up job"|"Checkout"|"Setup mise"|"Install dependencies"|"Install Playwright system dependencies"|"Check token") REASON="infra" ;;
                *) REASON="agent_failed" ;;
              esac
            elif [ "$CONCLUSION" = "cancelled" ] && [ "$DURATION" -ge "$JOB_TIMEOUT_SECONDS" ]; then
              REASON="timeout"
            else
              REASON="cancelled" # отмена вручную или вытеснение — проверить по логам
            fi
          fi

          if [ "$IS_PR" = "true" ]; then
            SHA=$(gh pr view "$NUMBER" --json headRefOid --jq .headRefOid)
          else
            SHA="$GITHUB_SHA"
          fi

          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### ⛔ Агент остановлен — нужен человек"
            echo
            echo "- Причина: \`$REASON\`"
            if [ "$IS_PR" = "true" ]; then
              echo "- Использовано запусков агента на этот PR: $USED/$LIMIT"
            fi
            echo "- SHA: \`$SHA\`"
            echo "- Логи прогона: $RUN_URL"
          } > "$RUNNER_TEMP/report.md"

          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/report.md"
